[project]
name = "mydjango"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lhh", email = "493126627@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "pymysql>=1.1.0",
    "pillow>=13.0.0",
    "openpyxl>=3.1.5",
    "dj-database-url>=3.1.2",
    "django-environ>=0.14.0",
    "cryptography>=50.0.2",
    "gunicorn>=26.2.0",
]

[project.scripts]
mydjango = "mydjango:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
